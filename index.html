<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Examen - Contratos (por bloques)</title>
    <style>
        :root {
            --bg: #fff5f7;
            --card-bg: #ffffff;
            --text: #4a2c3e;
            --text-secondary: #7d5a6b;
            --primary: #d63384;
            --primary-hover: #b82a6f;
            --success: #20c997;
            --danger: #e5536b;
            --warning: #f7c948;
            --border: #f2d0dc;
            --shadow: 0 4px 20px rgba(214, 51, 132, 0.08);
            --progress-bg: #f8d5e3;
            --option-bg: #fffafc;
            --option-hover: #ffe6f0;
            --selected-bg: #ffe6f0;
            --selected-border: #d63384;
            --correct-bg: #e6f9f2;
            --correct-border: #20c997;
            --incorrect-bg: #ffe6ea;
            --incorrect-border: #e5536b;
            --timer-bg: #d63384;
            --timer-text: #ffffff;
            --badge-bg: #ffe6f0;
            --badge-text: #d63384;
            --nav-btn-bg: #fce4ec;
            --nav-btn-text: #d63384;
            --explanation-bg: #fff8e1;
            --explanation-border: #f7c948;
            --overlay: rgba(0, 0, 0, 0.4);
            --modal-bg: #fff;
            --checkbox-size: 22px;
        }

        [data-theme="dark"] {
            --bg: #1f1118;
            --card-bg: #2d1b24;
            --text: #f0dce5;
            --text-secondary: #b895a6;
            --primary: #f06292;
            --primary-hover: #ec407a;
            --success: #66d9b8;
            --danger: #f2848d;
            --warning: #f7c948;
            --border: #4a2f3c;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            --progress-bg: #4a2f3c;
            --option-bg: #2d1b24;
            --option-hover: #3d2532;
            --selected-bg: #3d2532;
            --selected-border: #f06292;
            --correct-bg: #1e4a3b;
            --correct-border: #66d9b8;
            --incorrect-bg: #4a2530;
            --incorrect-border: #f2848d;
            --timer-bg: #f06292;
            --timer-text: #ffffff;
            --badge-bg: #3d2532;
            --badge-text: #f8bbd0;
            --nav-btn-bg: #3d2532;
            --nav-btn-text: #f0dce5;
            --explanation-bg: #3d2e1c;
            --explanation-border: #f7c948;
            --overlay: rgba(0, 0, 0, 0.7);
            --modal-bg: #2d1b24;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            transition: background 0.3s, color 0.3s; line-height: 1.6;
            display: flex; flex-direction: column; align-items: center;
        }

        .header {
            width: 100%; background: var(--card-bg); border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 1rem; box-shadow: var(--shadow); position: sticky; top: 0;
            z-index: 100; transition: background 0.3s;
        }
        .header-left { display: flex; align-items: center; gap: 1rem; }
        .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); letter-spacing: -0.5px; }
        .header-actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
        .btn {
            padding: 0.55rem 1.2rem; border: none; border-radius: 10px; cursor: pointer;
            font-weight: 600; font-size: 0.9rem; transition: all 0.25s; display: inline-flex;
            align-items: center; gap: 0.4rem; letter-spacing: 0.2px; white-space: nowrap;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: 0 8px 20px rgba(214,51,132,0.3); transform: translateY(-1px); }
        .btn-outline { background: transparent; border: 2px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--option-hover); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { opacity: 0.9; }
        .btn-success { background: var(--success); color: #fff; }
        .btn-success:hover { opacity: 0.9; }
        .btn-icon {
            width: 40px; height: 40px; padding: 0; border-radius: 50%; display: inline-flex;
            align-items: center; justify-content: center; font-size: 1.1rem;
            background: var(--nav-btn-bg); color: var(--nav-btn-text); border: 2px solid transparent;
        }
        .btn-icon:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 0.4rem 0.9rem; font-size: 0.8rem; border-radius: 8px; }

        .timer-display {
            background: var(--timer-bg); color: var(--timer-text); padding: 0.45rem 1rem;
            border-radius: 20px; font-weight: 700; font-size: 0.95rem; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 0.4rem; transition: background 0.3s;
        }
        .timer-display.warning { animation: pulse 0.8s infinite; color: #ffffff; background: #e5536b; }
        [data-theme="dark"] .timer-display.warning { background: #e5536b; color: #fff; }
        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }

        .main-container { width: 100%; max-width: 850px; padding: 1.5rem; flex: 1; display: flex; flex-direction: column; gap: 1.5rem; }
        .card {
            background: var(--card-bg); border-radius: 16px; padding: 1.8rem; box-shadow: var(--shadow);
            border: 1px solid var(--border); transition: all 0.3s; animation: fadeSlideIn 0.4s ease;
        }
        @keyframes fadeSlideIn { from{opacity:0;transform:translateY(15px);} to{opacity:1;transform:translateY(0);} }
        .card-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.2rem; }
        .question-badge {
            background: var(--badge-bg); color: var(--badge-text); padding: 0.35rem 0.9rem;
            border-radius: 20px; font-weight: 700; font-size: 0.85rem;
        }
        .question-type {
            font-size: 0.8rem; font-weight: 600; background: var(--warning); color: #000;
            padding: 0.2rem 0.7rem; border-radius: 12px;
        }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .options-list { list-style: none; display: flex; flex-direction: column; gap: 0.7rem; }
        .option-item {
            padding: 0.9rem 1.2rem; border-radius: 12px; cursor: pointer; border: 2px solid var(--border);
            background: var(--option-bg); transition: all 0.2s; font-weight: 500; user-select: none;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .option-item:hover { background: var(--option-hover); border-color: var(--primary); transform: translateX(3px); }
        .option-item.selected { background: var(--selected-bg); border-color: var(--selected-border); font-weight: 600; }
        .option-item.correct { background: var(--correct-bg); border-color: var(--correct-border); font-weight: 700; cursor: default; }
        .option-item.incorrect { background: var(--incorrect-bg); border-color: var(--incorrect-border); font-weight: 700; cursor: default; animation: shake 0.5s; }
        @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 50%{transform:translateX(8px);} 75%{transform:translateX(-4px);} }
        .option-letter {
            display: inline-block; width: 28px; height: 28px; border-radius: 50%; background: var(--primary);
            color: #fff; text-align: center; line-height: 28px; font-weight: 700; margin-right: 0.6rem;
            font-size: 0.85rem; flex-shrink: 0;
        }
        .explanation-box {
            margin-top: 1rem; padding: 1rem; background: var(--explanation-bg);
            border-left: 4px solid var(--explanation-border); border-radius: 8px; font-size: 0.9rem;
            color: var(--text); animation: fadeSlideIn 0.4s ease;
        }
        .progress-container { width: 100%; margin-bottom: 0.5rem; }
        .progress-bar-outer { width: 100%; height: 10px; background: var(--progress-bg); border-radius: 10px; overflow: hidden; }
        .progress-bar-inner { height: 100%; background: var(--primary); border-radius: 10px; transition: width 0.4s ease; }
        .progress-label { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.3rem; }
        .nav-buttons { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
        .nav-dots { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .nav-dot {
            width: 12px; height: 12px; border-radius: 50%; background: var(--progress-bg);
            cursor: pointer; transition: all 0.2s; border: 2px solid transparent;
        }
        .nav-dot.active { background: var(--primary); transform: scale(1.3); }
        .nav-dot.answered { background: var(--success); border-color: var(--success); }
        .nav-dot.answered-incorrect { background: var(--danger); border-color: var(--danger); }
        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; margin: 1.2rem 0; }
        .result-card { background: var(--option-bg); border-radius: 12px; padding: 1rem; text-align: center; border: 2px solid var(--border); }
        .result-value { font-size: 2rem; font-weight: 800; color: var(--primary); }
        .result-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .grade-circle {
            width: 100px; height: 100px; border-radius: 50%; border: 6px solid var(--primary);
            display: flex; align-items: center; justify-content: center; font-size: 2.5rem;
            font-weight: 800; color: var(--primary); margin: 0 auto;
        }
        .modal-overlay {
            position: fixed; inset: 0; background: var(--overlay); display: flex;
            align-items: center; justify-content: center; z-index: 200; animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
        .modal {
            background: var(--modal-bg); border-radius: 16px; padding: 2rem; max-width: 450px;
            width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); animation: fadeSlideIn 0.3s ease;
        }
        .modal h3 { margin-bottom: 1rem; }
        .modal-buttons { display: flex; gap: 1rem; justify-content: center; margin-top: 1.5rem; flex-wrap: wrap; }

        /* Pantalla de selección de bloque */
        .bloque-container {
            display: flex; flex-direction: column; align-items: center; gap: 2rem;
            padding: 3rem 1rem; text-align: center;
        }
        .bloque-botones { display: flex; gap: 2rem; flex-wrap: wrap; justify-content: center; }
        .btn-bloque {
            width: 220px; padding: 2rem 1rem; border-radius: 20px; font-size: 1.2rem;
            font-weight: 700; background: var(--card-bg); border: 2px solid var(--border);
            color: var(--text); cursor: pointer; transition: all 0.3s;
            box-shadow: var(--shadow);
        }
        .btn-bloque:hover {
            border-color: var(--primary); background: var(--option-hover);
            transform: translateY(-5px); box-shadow: 0 12px 30px rgba(214,51,132,0.2);
        }
        .btn-bloque .emoji { font-size: 2.5rem; display: block; margin-bottom: 0.5rem; }
        .bloque-info { color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.5rem; }

        @media (max-width: 600px) {
            .header { padding: 0.8rem 1rem; }
            .btn { padding: 0.45rem 0.9rem; font-size: 0.8rem; }
            .card { padding: 1.2rem; }
            .question-text { font-size: 1rem; }
            .btn-bloque { width: 180px; padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body data-theme="light">
    <header class="header">
        <div class="header-left">
            <span class="logo">🌸 Simulador Contratos</span>
            <span class="timer-display" id="timerDisplay" style="display:none;">
                ⏱ <span id="timerValue">60:00</span>
            </span>
        </div>
        <div class="header-actions">
            <button class="btn btn-outline btn-sm" onclick="toggleTimer()" id="btnToggleTimer">⏱ Timer</button>
            <button class="btn-icon" onclick="toggleTheme()" title="Modo claro/oscuro">🌓</button>
            <button class="btn btn-outline btn-sm" onclick="nuevoExamen()">🔄 Nuevo examen</button>
            <button class="btn btn-outline btn-sm" onclick="reiniciarRespuestas()">🗑 Reiniciar</button>
            <button class="btn btn-success btn-sm" onclick="confirmarCorreccion()">✅ Corregir</button>
        </div>
    </header>

    <main class="main-container" id="mainContainer"></main>

    <div class="modal-overlay" id="modalConfirm" style="display:none;">
        <div class="modal">
            <h3>⚠️ ¿Corregir examen?</h3>
            <p>Una vez corregido, no podrás cambiar tus respuestas de este bloque.</p>
            <div class="modal-buttons">
                <button class="btn btn-outline" onclick="cerrarModal()">Seguir revisando</button>
                <button class="btn btn-success" onclick="corregirExamen()">Corregir ahora</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalResultados" style="display:none;">
        <div class="modal" style="max-width:550px;">
            <h3 id="resultadosTitulo">📊 Resultados del Bloque</h3>
            <div id="resultadosContenido"></div>
            <div class="modal-buttons" id="resultadosBotones">
                <button class="btn btn-primary" onclick="cerrarModalResultados()">Revisar respuestas</button>
                <button class="btn btn-outline" id="btnSiguienteBloque" style="display:none;" onclick="siguienteBloque()">▶ Siguiente bloque</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 🚨 BANCO DE PREGUNTAS - DERECHO DE CONTRATOS (95 preguntas)
        // ============================================
        const bancoPreguntas = [    
            {
                pregunta: "Contrato de adhesión: Determine en el siguiente ejemplo de qué clase de cláusula abusiva se trata: “Cláusula por la cual se libera de la obligación de custodia al propietario del estacionamiento de automotores”",
                opciones: [
                    "Desnaturalizan la obligación del predisponente",
                    "Amplían los derechos del predisponente",
                    "Estipulaciones sorpresivas en virtud de su contenido"
                ],
                correcta: "Desnaturalizan la obligación del predisponente"
            },
            {
                pregunta: "En la venta domiciliaria prevista por ley de defensa al consumidor",
                opciones: [
                    "El consumidor puede revocar su aceptación durante el plazo de siete días hábiles, contados a partir de la entrega de la cosa o de la ejecución del contrato, pero deberá pagar los daños y perjuicios que ocasione",
                    "El consumidor puede revocar su aceptación durante el plazo de diez días corridos, contados a partir de la celebración del contrato o de la entrega de la cosa, lo último que ocurra; sin responsabilidad alguna",
                    "El contrato puede ser celebrado por escrito, verbalmente o por signos inequívocos y no existe facultad de revocar la aceptación"
                ],
                correcta: "El consumidor puede revocar su aceptación durante el plazo de diez días corridos, contados a partir de la celebración del contrato o de la entrega de la cosa, lo último que ocurra; sin responsabilidad alguna"
            },
            {
                pregunta: "“Ramón realiza tratativas con Daniel para vender un inmueble de su propiedad conviniendo que el precio sería de $2.000.000, pagadero en un plazo de 24 meses y que en el lugar el comprador instalaría un supermercado. Aunque no firmaron instrumento alguno, Daniel entregó al vendedor la primer cuota e ingresó al local para hacer arreglos” ¿Quedó perfeccionado el contrato?",
                opciones: [
                    "El contrato no se perfeccionó por cuanto, no hubo oferta y aceptación concreta, por ambas partes",
                    "El contrato no se perfeccionó por cuanto si bien hubo tratativas contractuales, el acuerdo no se plasmó por escrito",
                    "El contrato se perfeccionó por la conducta de las partes, suficiente para perfeccionar el acuerdo"
                ],
                correcta: "El contrato se perfeccionó por la conducta de las partes, suficiente para perfeccionar el acuerdo"
            },
            {
                pregunta: "Determine qué clase de incapacidad para contratar se manifiesta en el siguiente caso: “La prohibición de que las personas incapaces de contratar todo tipo de actos jurídicos, respecto de los bienes de las personas incapaces o con capacidad restringida bajo su representación”",
                opciones: [
                    "Capacidad restringida",
                    "Incapacidad de derecho",
                    "Incapacidad de hecho"
                ],
                correcta: "Incapacidad de derecho"
            },
            {
                pregunta: "Formación del consentimiento. Miguel (quien vive en Buenos Aires) le envía a Fausto (quien vive en Salta) una oferta el 3 de diciembre. Fausto la recibe el 5 de diciembre y acepta. El 6 de diciembre le envía a Miguel su aceptación. Miguel recibe la aceptación el 9 de diciembre.¿Cuándo se perfeccionó el contrato?",
                opciones: [
                    "Cuando Miguel recibe la aceptación de Fausto (9 de diciembre)",
                    "Cuando Fausto envía a Miguel su aceptación (6 de diciembre)",
                    "Cuando Fausto acepta (5 de diciembre)"
                ],
                correcta: "Cuando Miguel recibe la aceptación de Fausto (9 de diciembre)"
            },
            {
                pregunta: "Conforme al nuevo C y C, ¿qué efectos produce la resolución contractual que tiene como causa el cumplimiento de una condición resolutoria?",
                opciones: [
                    "Solo produce efectos futuros",
                    "Es como si nunca se hubiere celebrado el contrato",
                    "Tiene efecto retroactivo desde el momento de la celebración del negocio jurídico"
                ],
                correcta: "Tiene efecto retroactivo desde el momento de la celebración del negocio jurídico"
            },
            {
                pregunta: "¿En qué consisten las tratativas contractuales?",
                opciones: [
                    "Constituyen diálogos, intercambios de información y evaluaciones de factibilidad preliminares que preceden a la asunción de obligaciones contractuales y permiten a los negociantes establecer los términos del contrato que procuran celebrar. Se asientan sobre los principios de la libre negociación, la buena fe y la confidencialidad.",
                    "Solo tienen fuerza obligatoria en el caso de tener todos los elementos de la oferta",
                    "Su finalidad es la de posibilitar el avance hacia la concreción del contrato definitivo. Deben contener el acuerdo sobre los elementos esenciales particulares que identifiquen el contrato futuro, su duración y su plazo de vigencia es de un año o el menor que convengan las partes, quienes pueden renovarlo a su vencimiento."
                ],
                correcta: "Constituyen diálogos, intercambios de información y evaluaciones de factibilidad preliminares que preceden a la asunción de obligaciones contractuales y permiten a los negociantes establecer los términos del contrato que procuran celebrar. Se asientan sobre los principios de la libre negociación, la buena fe y la confidencialidad."
            },
            {
                pregunta: "La teoría de la imprevisión como un remedio jurídico procede en:",
                opciones: [
                    "Cualquier contrato oneroso o gratuito",
                    "Contratos conmutativos de ejecución continuada o diferida onerosos",
                    "Contratos onerosos de ejecución inmediata o de ejecución única"
                ],
                correcta: "Contratos conmutativos de ejecución continuada o diferida onerosos"
            },
            {
                pregunta: "En el caso de los contratos conexos, ¿cómo deben interpretarse?",
                opciones: [
                    "Protegiendo al vulnerable",
                    "Conforme a su función económica y el resultado perseguido",
                    "En sentido contrario a la parte predisponente"
                ],
                correcta: "Conforme a su función económica y el resultado perseguido"
            },
            {
                pregunta: "En la ley de Defensa del consumidor, ¿qué se entiende por daño directo?",
                opciones: [
                    "Todo perjuicio o menoscabo al derecho del usuario o consumidor, susceptible de apreciación pecuniaria, ocasionado de manera MEDIATA sobre sus bienes o sobre su persona, como consecuencia de la acción u omisión del proveedor de bienes o prestador de servicios",
                    "Todo perjuicio que no tenga justificación alguna",
                    "Todo perjuicio o menoscabo al derecho del usuario o consumidor, susceptible de apreciación pecuniaria, ocasionado de manera INMEDIATA sobre sus bienes o sobre su persona, como consecuencia de la acción u omisión del proveedor de bienes o prestador de servicios"
                ],
                correcta: "Todo perjuicio o menoscabo al derecho del usuario o consumidor, susceptible de apreciación pecuniaria, ocasionado de manera INMEDIATA sobre sus bienes o sobre su persona, como consecuencia de la acción u omisión del proveedor de bienes o prestador de servicios"
            },
            {
                pregunta: "Efecto de los contratos: Límites legales a la fuerza obligatoria de los contratos",
                opciones: [
                    "La lesión subjetiva objetiva",
                    "La teoría de los actos propios",
                    "La teoría de la apariencia"
                ],
                correcta: "La lesión subjetiva objetiva"
            },
            {
                pregunta: "Determine en el siguiente ejemplo a qué clase de causa se refiere y que consecuencias trae aparejada: “Luis promete a su Contador una retribución porcentual sobre el monto de impuestos que se ahorre su empresa”",
                opciones: [
                    "Causa ilícita, por lo cual genera una nulidad absoluta",
                    "Causa ilícita, que genera una nulidad relativa",
                    "Causa licita, por ende, el negocio jurídico es válido"
                ],
                correcta: "Causa ilícita, por lo cual genera una nulidad absoluta"
            },
            {
                pregunta: "Determine en el siguiente caso: ¿Cuál sería el marco jurídico o sistema de normas que aplicaría en la especie?- “Pedro, el 4 de diciembre de 2021, circulaba a bordo de su automóvil junto con su esposa Delia, y sus dos hijos, por la autopista Panamericana (Bs As.), cuando se hallaba por cruzar el peaje por la línea del telepase, por razones que desconoce, la apertura de la barrera no funcionó lo que provocó que frene súbitamente, y quien circulaba detrás suyo lo embistiera fuertemente la parte trasera del rodado provocando daños de consideración al vehículo y a su familia”.",
                opciones: [
                    "Ley 24.240 y 26.361",
                    "C.C y C.",
                    "Ley 24.240 y su modif.,C.N. y C.C. y C."
                ],
                correcta: "Ley 24.240 y su modif.,C.N. y C.C. y C."
            },
            {
                pregunta: "Determine qué clase de incapacidad para contratar se manifiesta en el siguiente caso: “La prohibición o impedimento que pesa de celebrar contrato de comodato entre tutores y curadores, respecto de los bienes de las personas incapaces o con capacidad restringida bajo su representación”",
                opciones: [
                    "Capacidad restringida",
                    "Incapacidad de derecho",
                    "Incapacidad de ejercicio"
                ],
                correcta: "Incapacidad de derecho"
            },
            {
                pregunta: "Determine en el siguiente ejemplo a qué clase de causa se refiere y que consecuencias trae aparejado: “Pedro promete a su Contador una retribución porcentual sobre el monto de impuestos que se ahorre su empresa”",
                opciones: [
                    "Causa licita, por ende, el negocio jurídico es válido",
                    "Causa ilícita, que genera una nulidad relativa",
                    "Causa ilícita, por lo cual genera una nulidad absoluta"
                ],
                correcta: "Causa ilícita, por lo cual genera una nulidad absoluta"

        // ============================================
        // FIN DEL BANCO DE PREGUNTAS

        // División del banco en dos bloques
        const mitad = Math.ceil(bancoPreguntas.length / 2); // 48
        const bloque1Preguntas = bancoPreguntas.slice(0, mitad);
        const bloque2Preguntas = bancoPreguntas.slice(mitad);

        // Estado global
        let bloqueActual = null; // 1 o 2
        let examenActual = [];
        let respuestasUsuario = {};
        let examenCorregido = false;
        let temporizadorActivo = false;
        let tiempoRestante = 60 * 60; // 60 minutos por bloque
        let timerInterval = null;
        let preguntaActualIndex = 0;

        // Resultados acumulados
        let resultadoBloque1 = null;
        let resultadoBloque2 = null;

        function inicializar() {
            cargarTema();
            mostrarSeleccionBloque();
        }

        function mostrarSeleccionBloque() {
            bloqueActual = null;
            resultadoBloque1 = null;
            resultadoBloque2 = null;
            detenerTemporizador();
            document.getElementById('timerDisplay').style.display = 'none';
            document.getElementById('btnToggleTimer').textContent = '⏱ Timer';

            const container = document.getElementById('mainContainer');
            container.innerHTML = `
            <div class="bloque-container">
              <h2 style="color: var(--primary);">📚 Seleccioná con qué bloque comenzar</h2>
              <p style="color: var(--text-secondary);">Cada bloque se corrige por separado. Al finalizar ambos, verás el resultado total.</p>
              <div class="bloque-botones">
                <button class="btn-bloque" onclick="seleccionarBloque(1)">
                  <span class="emoji">📖</span> Bloque 1
                  <div class="bloque-info">${bloque1Preguntas.length} preguntas</div>
                </button>
                <button class="btn-bloque" onclick="seleccionarBloque(2)">
                  <span class="emoji">📘</span> Bloque 2
                  <div class="bloque-info">${bloque2Preguntas.length} preguntas</div>
                </button>
              </div>
            </div>`;
        }

        function seleccionarBloque(numero) {
            bloqueActual = numero;
            resultadoBloque1 = (numero === 1 && resultadoBloque1) ? resultadoBloque1 : null;
            resultadoBloque2 = (numero === 2 && resultadoBloque2) ? resultadoBloque2 : null;
            generarNuevoExamen();
        }

        function fisherYatesShuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function generarNuevoExamen() {
            if (!bloqueActual) {
                mostrarSeleccionBloque();
                return;
            }
            detenerTemporizador();
            temporizadorActivo = false;
            document.getElementById('btnToggleTimer').textContent = '⏱ Timer';
            document.getElementById('timerDisplay').style.display = 'none';
            tiempoRestante = 60 * 60;
            actualizarTimerDisplay();

            examenCorregido = false;
            respuestasUsuario = {};
            preguntaActualIndex = 0;

            const preguntasFuente = bloqueActual === 1 ? bloque1Preguntas : bloque2Preguntas;
            examenActual = fisherYatesShuffle(preguntasFuente);
            examenActual = examenActual.map(p => {
                const opcionesOriginales = [...p.opciones];
                const correctaOriginal = p.correcta;
                const indices = opcionesOriginales.map((_, i) => i);
                const indicesMezclados = fisherYatesShuffle(indices);
                const nuevasOpciones = indicesMezclados.map(i => opcionesOriginales[i]);
                return { ...p, opciones: nuevasOpciones, correcta: correctaOriginal };
            });

            renderizarExamen();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function nuevoExamen() {
            if (!bloqueActual) return;
            if (temporizadorActivo || Object.keys(respuestasUsuario).length > 0) {
                if (confirm('¿Generar un nuevo examen para este bloque? Perderás las respuestas actuales.')) generarNuevoExamen();
            } else generarNuevoExamen();
        }

        function reiniciarRespuestas() {
            if (!bloqueActual) return;
            if (examenCorregido) return alert('Este bloque ya fue corregido. Generá uno nuevo o pasá al siguiente bloque.');
            if (confirm('¿Borrar todas tus respuestas de este bloque?')) {
                respuestasUsuario = {};
                preguntaActualIndex = 0;
                renderizarExamen();
            }
        }

        function confirmarCorreccion() {
            if (!bloqueActual || examenCorregido) return;
            const respondidas = Object.keys(respuestasUsuario).length;
            const total = examenActual.length;
            if (respondidas < total && !confirm(`Solo has respondido ${respondidas} de ${total} preguntas. Las no respondidas se considerarán incorrectas. ¿Continuar?`)) return;
            document.getElementById('modalConfirm').style.display = 'flex';
        }

        function cerrarModal() { document.getElementById('modalConfirm').style.display = 'none'; }
        function cerrarModalResultados() {
            document.getElementById('modalResultados').style.display = 'none';
            // Si ya completó ambos bloques, volver a selección
            if (resultadoBloque1 && resultadoBloque2) {
                mostrarSeleccionBloque();
            }
        }

        function corregirExamen() {
            cerrarModal();
            detenerTemporizador();
            temporizadorActivo = false;
            document.getElementById('btnToggleTimer').textContent = '⏱ Timer';
            document.getElementById('timerDisplay').style.display = 'none';
            examenCorregido = true;
            renderizarExamen();
            mostrarResultados();
        }

        function siguienteBloque() {
            document.getElementById('modalResultados').style.display = 'none';
            if (bloqueActual === 1) {
                seleccionarBloque(2);
            } else {
                seleccionarBloque(1);
            }
        }

        function toggleSeleccionMultiple(indice, opcion) {
            if (examenCorregido) return;
            let seleccionadas = respuestasUsuario[indice] || [];
            if (!Array.isArray(seleccionadas)) seleccionadas = [];
            const index = seleccionadas.indexOf(opcion);
            if (index > -1) {
                seleccionadas.splice(index, 1);
            } else {
                seleccionadas.push(opcion);
            }
            respuestasUsuario[indice] = seleccionadas.length > 0 ? seleccionadas : undefined;
            renderizarExamen();
        }

        function seleccionarRespuestaUnica(indice, respuesta) {
            if (examenCorregido) return;
            respuestasUsuario[indice] = respuesta;
            renderizarExamen();
        }

        function verificarRespuesta(indice) {
            const p = examenActual[indice];
            const resp = respuestasUsuario[indice];
            if (resp === undefined) return false;
            if (Array.isArray(p.correcta)) {
                if (!Array.isArray(resp)) return false;
                const correctaSorted = [...p.correcta].sort();
                const respSorted = [...resp].sort();
                return correctaSorted.length === respSorted.length && correctaSorted.every((val, idx) => val === respSorted[idx]);
            } else {
                return resp === p.correcta;
            }
        }

        function renderizarExamen() {
            if (!bloqueActual) {
                mostrarSeleccionBloque();
                return;
            }
            const container = document.getElementById('mainContainer');
            const total = examenActual.length;
            const respondidas = Object.keys(respuestasUsuario).length;
            const porcentaje = Math.round((respondidas / total) * 100);

            let dotsHTML = '';
            for (let i = 0; i < total; i++) {
                let dotClass = 'nav-dot';
                if (i === preguntaActualIndex) dotClass += ' active';
                if (respuestasUsuario[i] !== undefined) {
                    if (examenCorregido) {
                        dotClass += verificarRespuesta(i) ? ' answered' : ' answered-incorrect';
                    } else dotClass += ' answered';
                }
                dotsHTML += `<span class="${dotClass}" onclick="irAPregunta(${i})" title="Pregunta ${i+1}"></span>`;
            }

            const pActual = examenActual[preguntaActualIndex];
            const multiple = Array.isArray(pActual.correcta);
            const respuestaSel = respuestasUsuario[preguntaActualIndex];

            let opcionesHTML = '';
            pActual.opciones.forEach((opcion, idx) => {
                let clase = 'option-item';
                const letra = 'ABCD'[idx] || '•';
                
                if (multiple) {
                    const seleccionadas = Array.isArray(respuestaSel) ? respuestaSel : [];
                    if (seleccionadas.includes(opcion)) clase += ' selected';
                    if (examenCorregido) {
                        const correctasArray = pActual.correcta;
                        if (correctasArray.includes(opcion) && seleccionadas.includes(opcion)) clase += ' correct';
                        else if (!correctasArray.includes(opcion) && seleccionadas.includes(opcion)) clase += ' incorrect';
                        else if (correctasArray.includes(opcion) && !seleccionadas.includes(opcion)) clase += ' correct';
                    }
                    opcionesHTML += `
                    <label class="${clase}">
                        <input type="checkbox" class="option-checkbox" ${examenCorregido ? 'disabled' : ''}
                            ${Array.isArray(respuestaSel) && respuestaSel.includes(opcion) ? 'checked' : ''}
                            onchange="toggleSeleccionMultiple(${preguntaActualIndex}, '${opcion.replace(/'/g, "\\'")}')" />
                        <span class="option-letter">${letra}</span>
                        <span>${opcion}</span>
                        ${examenCorregido && pActual.correcta.includes(opcion) ? ' ✅' : ''}
                    </label>`;
                } else {
                    if (respuestaSel === opcion) clase += ' selected';
                    if (examenCorregido) {
                        if (opcion === pActual.correcta) clase += ' correct';
                        else if (respuestaSel === opcion && opcion !== pActual.correcta) clase += ' incorrect';
                    }
                    const onclickAttr = examenCorregido ? '' : `onclick="seleccionarRespuestaUnica(${preguntaActualIndex}, '${opcion.replace(/'/g, "\\'")}')"`;
                    opcionesHTML += `
                    <li class="${clase}" ${onclickAttr} style="display:flex;align-items:center;">
                        <span class="option-letter">${letra}</span>
                        <span>${opcion}</span>
                        ${examenCorregido && opcion === pActual.correcta ? ' ✅' : ''}
                        ${examenCorregido && respuestaSel === opcion && opcion !== pActual.correcta ? ' ❌' : ''}
                    </li>`;
                }
            });

            let explicacionHTML = '';
            if (examenCorregido && pActual.explicacion) {
                explicacionHTML = `<div class="explanation-box"><strong>💡 Explicación:</strong> ${pActual.explicacion}</div>`;
            }

            container.innerHTML = `
            <div class="progress-container">
              <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${porcentaje}%;"></div></div>
              <div class="progress-label"><span>Progreso Bloque ${bloqueActual}: ${respondidas}/${total}</span><span>${porcentaje}%</span></div>
            </div>
            <div class="nav-dots">${dotsHTML}</div>
            <div class="card">
              <div class="card-header">
                <span class="question-badge">Pregunta ${preguntaActualIndex + 1} de ${total}</span>
                <span class="question-type">${multiple ? 'Selección múltiple' : 'Opción única'}</span>
                <span>${respuestaSel !== undefined ? '✅ Respondida' : '❓ Sin responder'}</span>
              </div>
              <p class="question-text">${pActual.pregunta}</p>
              <div class="options-list">${opcionesHTML}</div>
              ${explicacionHTML}
              <div class="nav-buttons">
                <button class="btn btn-outline btn-sm" onclick="irAPregunta(${preguntaActualIndex - 1})" ${preguntaActualIndex === 0 ? 'disabled' : ''}>⬅ Anterior</button>
                <span>Usa los puntos para navegar</span>
                <button class="btn btn-outline btn-sm" onclick="irAPregunta(${preguntaActualIndex + 1})" ${preguntaActualIndex === total - 1 ? 'disabled' : ''}>Siguiente ➡</button>
              </div>
              <div style="text-align:center;margin-top:1rem;">
                <button class="btn btn-outline btn-sm" onclick="irAPregunta(0)">🏠 Ir al inicio</button>
              </div>
            </div>`;
        }

        function irAPregunta(index) {
            if (index < 0 || index >= examenActual.length) return;
            preguntaActualIndex = index;
            renderizarExamen();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function mostrarResultados() {
            let correctas = 0;
            for (let i = 0; i < examenActual.length; i++) {
                if (verificarRespuesta(i)) correctas++;
            }
            const total = examenActual.length;
            const incorrectas = total - correctas;
            const porcentaje = Math.round((correctas / total) * 100);
            const nota = (correctas / total) * 10;

            // Guardar resultado del bloque actual
            const resultado = { correctas, total, incorrectas, porcentaje, nota };
            if (bloqueActual === 1) resultadoBloque1 = resultado;
            else resultadoBloque2 = resultado;

            const titulo = document.getElementById('resultadosTitulo');
            titulo.textContent = `📊 Resultados Bloque ${bloqueActual}`;

            let resumenHTML = `
            <div class="results-grid">
              <div class="result-card"><div class="result-value">${total}</div><div class="result-label">Total preguntas</div></div>
              <div class="result-card"><div class="result-value" style="color:var(--success);">${correctas}</div><div class="result-label">Correctas</div></div>
              <div class="result-card"><div class="result-value" style="color:var(--danger);">${incorrectas}</div><div class="result-label">Incorrectas</div></div>
              <div class="result-card"><div class="result-value">${porcentaje}%</div><div class="result-label">Aciertos</div></div>
            </div>
            <div class="grade-circle">${nota.toFixed(1)}</div>
            <p style="margin-top:0.5rem;font-weight:600;">Nota sobre 10</p>`;

            // Si ambos bloques completos, agregar resumen total
            if (resultadoBloque1 && resultadoBloque2) {
                const totalGlobal = resultadoBloque1.total + resultadoBloque2.total;
                const correctasGlobal = resultadoBloque1.correctas + resultadoBloque2.correctas;
                const notaGlobal = (correctasGlobal / totalGlobal) * 10;
                resumenHTML += `
                <hr style="margin:1.5rem 0; border-color: var(--border);">
                <h4 style="color:var(--primary);">🏆 Resultado Final (ambos bloques)</h4>
                <div class="results-grid">
                  <div class="result-card"><div class="result-value">${totalGlobal}</div><div class="result-label">Total</div></div>
                  <div class="result-card"><div class="result-value" style="color:var(--success);">${correctasGlobal}</div><div class="result-label">Correctas</div></div>
                  <div class="result-card"><div class="result-value">${Math.round((correctasGlobal / totalGlobal) * 100)}%</div><div class="result-label">Aciertos</div></div>
                </div>
                <div class="grade-circle">${notaGlobal.toFixed(1)}</div>
                <p style="margin-top:0.5rem;font-weight:600;">Nota final sobre 10</p>`;
                // Ocultar botón de siguiente
                document.getElementById('btnSiguienteBloque').style.display = 'none';
            } else {
                // Mostrar botón para ir al otro bloque
                document.getElementById('btnSiguienteBloque').style.display = 'inline-flex';
                document.getElementById('btnSiguienteBloque').textContent = bloqueActual === 1 ? '▶ Ir al Bloque 2' : '▶ Ir al Bloque 1';
            }

            document.getElementById('resultadosContenido').innerHTML = resumenHTML;
            document.getElementById('modalResultados').style.display = 'flex';
        }

        // --- Temporizador ---
        function toggleTimer() {
            if (!bloqueActual || examenCorregido) return;
            if (temporizadorActivo) {
                detenerTemporizador();
                temporizadorActivo = false;
                document.getElementById('btnToggleTimer').textContent = '⏱ Timer';
                document.getElementById('timerDisplay').style.display = 'none';
            } else {
                if (tiempoRestante <= 0) tiempoRestante = 60 * 60;
                temporizadorActivo = true;
                document.getElementById('btnToggleTimer').textContent = '⏱ Detener';
                document.getElementById('timerDisplay').style.display = 'inline-flex';
                iniciarTemporizador();
            }
        }

        function iniciarTemporizador() {
            actualizarTimerDisplay();
            timerInterval = setInterval(() => {
                tiempoRestante--;
                actualizarTimerDisplay();
                if (tiempoRestante <= 0) {
                    detenerTemporizador();
                    alert('⏰ ¡Tiempo agotado para este bloque! Se corregirá automáticamente.');
                    corregirExamen();
                }
            }, 1000);
        }

        function detenerTemporizador() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        }

        function actualizarTimerDisplay() {
            const min = Math.floor(tiempoRestante / 60);
            const seg = tiempoRestante % 60;
            document.getElementById('timerValue').textContent = `${min.toString().padStart(2,'0')}:${seg.toString().padStart(2,'0')}`;
            const timerDisp = document.getElementById('timerDisplay');
            timerDisp.classList.toggle('warning', tiempoRestante <= 300 && temporizadorActivo);
        }

        // --- Tema ---
        function toggleTheme() {
            const nuevo = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.body.setAttribute('data-theme', nuevo);
            localStorage.setItem('theme', nuevo);
        }

        function cargarTema() {
            const saved = localStorage.getItem('theme');
            if (saved) document.body.setAttribute('data-theme', saved);
        }

        document.addEventListener('keydown', e => { if (e.key === 'Escape') { cerrarModal(); cerrarModalResultados(); } });
        document.getElementById('modalConfirm').addEventListener('click', e => { if (e.target === e.currentTarget) cerrarModal(); });
        document.getElementById('modalResultados').addEventListener('click', e => { if (e.target === e.currentTarget) cerrarModalResultados(); });

        inicializar();
    </script>
</body>
</html>
